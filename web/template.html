<script>
window.addEventListener('error', function (e) {
  if (document.getElementById('fatal')) return;
  var d = document.createElement('div'); d.id = 'fatal';
  d.setAttribute('style', 'font:13px Verdana,Arial,sans-serif;background:#FFE0E0;border:2px solid #B00000;color:#000;padding:12px 16px;margin:12px');
  d.textContent = 'Ashyq Dala could not start: ' + (e.message || 'unknown error') + '. Please try a current Chrome, Edge, Firefox or Safari 16 or newer.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
